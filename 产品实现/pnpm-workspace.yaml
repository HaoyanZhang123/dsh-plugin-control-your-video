# Workspace root for the AI video workbench plugin (ENGINEERING-BASE).
#
# Every logical range in CT-00 maps to a subdirectory of this package, not to a
# separate workspace package:  core/ tools/ ui/ media/ orchestration/ editing/
# delivery/ acceptance/ contracts/ tests/ base/ scripts/.  `packages` therefore
# stays empty until an owner card proves a real need for an isolated package.
#
# Adding a nested workspace package, or a build script for a dependency, is a
# root-file change: it belongs to C04 through 总控, never to a leaf card.
packages: []

# No dependency may run install/build scripts until it is admitted in
# docs/DEPENDENCY-LEDGER.md with a verified license and purpose.
onlyBuiltDependencies: []
